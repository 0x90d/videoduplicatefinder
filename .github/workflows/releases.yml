name: Build releases

# Two kinds of release:
#   - every push to master rebuilds the rolling 4.1.x release, its assets replaced in place;
#   - pushing a tag like v4.1.1 publishes a release of that commit whose assets are never
#     replaced, so package managers (winget) can pin them by hash. The tag's version is
#     stamped into the binaries and must share major.minor with VersionPrefix in
#     Directory.Build.props.

on:
  push:
    branches: [master]
    tags: ['v*.*.*']

jobs:
  cleanup:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Delete old release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete all existing assets from the 4.1.x release so they get replaced with fresh
          # builds. '|| true' covers the very first run, before the release exists.
          # 4.0.x is FROZEN at v4.0-final (last old-UI build) and must never be touched again.
          gh release view 4.1.x --json assets --jq '.assets[].name' 2>/dev/null | while read -r asset; do
            gh release delete-asset 4.1.x "$asset" --yes
          done || true

  prepare-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check the tag and create a draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not of the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          PREFIX=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [[ "${VERSION%.*}" != "${PREFIX%.*}" ]]; then
            echo "::error::Tag '$TAG' does not match VersionPrefix $PREFIX in Directory.Build.props (major.minor)."
            exit 1
          fi
          # A versioned release is built once. After a failed run, delete the draft
          # (and the tag if needed) and push the tag again.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release '$TAG' already exists; versioned releases are never rebuilt."
            exit 1
          fi
          # Stays a draft until every platform has uploaded (publish-release below).
          NOTES="Built from commit ${GITHUB_SHA::7}. The assets of this release never change; the rolling 4.1.x release has the newest build."
          PREVIOUS=$(git tag --list 'v*.*.*' --sort=v:refname | awk -v t="$TAG" '$0 == t { print prev; exit } { prev = $0 }')
          if [[ -n "$PREVIOUS" ]]; then
            gh release create "$TAG" --draft --verify-tag --title "$VERSION" --notes "$NOTES" --generate-notes --notes-start-tag "$PREVIOUS"
          else
            gh release create "$TAG" --draft --verify-tag --title "$VERSION" --notes "$NOTES"
          fi

  build:
    needs: [cleanup, prepare-release]
    # One of the two is always skipped (branch push or tag push); run unless the other failed.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}

    strategy:
      # One platform failing (e.g. a runner-image hiccup) must not cancel the
      # siblings: the cleanup job already emptied the release, so a cancelled
      # matrix would leave it with missing assets until the next push.
      fail-fast: false
      matrix:
        kind: ['linux', 'windows', 'windowsarm64', 'macOS', 'macOSarm64', 'linuxarm64']
        include:
          - kind: linux
            os: ubuntu-latest
            target: linux-x64
            name: linux-x64
          - kind: windows
            os: windows-latest
            target: win-x64
            name: win-x64
          - kind: windowsarm64
            # Native ARM64 runner (same reasoning as linux-arm64): Native AOT
            # builds on its own architecture instead of relying on the x64
            # image's cross toolchain. The FFmpeg auto-downloader already picks
            # the BtbN winarm64 shared build on ARM64 Windows.
            os: windows-11-arm
            target: win-arm64
            name: win-arm64
          - kind: macOS
            os: macos-latest
            target: osx-x64
            name: osx-x64
          - kind: macOSarm64
            os: macos-latest
            target: osx-arm64
            name: osx-arm64
          - kind: linuxarm64
            # Native ARM64 runner: Native AOT cannot cross-compile from x64 to
            # linux-arm64 without a cross toolchain, so build it on its own arch.
            os: ubuntu-24.04-arm
            target: linux-arm64
            name: linux-arm64
            
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
    - name: Declare some variables
      id: vars
      shell: bash
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
    - name: Build
      shell: bash
      run: |
          # A versioned release (tag v4.1.1) stamps its version into every binary;
          # the rolling release keeps VersionPrefix from Directory.Build.props.
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          fi
          # Build GUI (Native AOT — verified AOT-safe for 4.0: compiled bindings,
          # source-generated JSON, statically-registered MemoryPack formatters)
          dotnet publish ./VDF.GUI/VDF.GUI.csproj -c Release -v q -p:PublishAot=true -p:VersionPrefix="$VERSION" -r "${{ matrix.target }}" -o "outputGUI"
          # Build CLI (Native AOT)
          dotnet publish ./VDF.CLI/VDF.CLI.csproj -c Release -v q -p:PublishAot=true -p:VersionPrefix="$VERSION" -r "${{ matrix.target }}" -o "outputCLI"
          # Build Web (JIT, self-contained — Blazor Server is not supported under Native AOT)
          dotnet publish ./VDF.Web/VDF.Web.csproj -c Release -v q --self-contained -p:VersionPrefix="$VERSION" -r "${{ matrix.target }}" -o "outputWeb"
          # Pack files
          if [[ "${{ matrix.target }}" == win-* ]]; then
            7z a -tzip "GUI-${{ matrix.target }}.zip" "./outputGUI/*"
            7z a -tzip "CLI-${{ matrix.target }}.zip" "./outputCLI/*"
            7z a -tzip "Web-${{ matrix.target }}.zip" "./outputWeb/*"
          elif [[ "${{ matrix.target }}" == osx-* ]]; then
            # Wrap the GUI in a proper macOS .app bundle
            mkdir -p "Video Duplicate Finder.app/Contents/MacOS"
            mkdir -p "Video Duplicate Finder.app/Contents/Resources"
            cp -r outputGUI/. "Video Duplicate Finder.app/Contents/MacOS/"
            cp "VDF.GUI/Assets/macOS/icon.icns" "Video Duplicate Finder.app/Contents/Resources/icon.icns"
            cp "VDF.GUI/Assets/macOS/Info.plist" "Video Duplicate Finder.app/Contents/Info.plist"
            plutil -replace CFBundleShortVersionString -string "$VERSION" "Video Duplicate Finder.app/Contents/Info.plist"
            plutil -replace CFBundleVersion -string "$VERSION" "Video Duplicate Finder.app/Contents/Info.plist"
            chmod +x "Video Duplicate Finder.app/Contents/MacOS/VDF.GUI"
            # Ad-hoc sign every binary in the bundle. macOS 14+ (and especially Tahoe 26)
            # rejects unsigned dylibs under Library Validation, which previously caused
            # "library load disallowed by system policy" on launch.
            codesign --force --deep --sign - \
              --entitlements "VDF.GUI/Assets/macOS/entitlements.plist" \
              "Video Duplicate Finder.app"
            codesign --verify --deep --strict --verbose=2 "Video Duplicate Finder.app"
            tar czvf "GUI-${{ matrix.target }}.tar.gz" "Video Duplicate Finder.app"
            chmod +x outputCLI/vdf-cli
            chmod +x outputWeb/VDF.Web
            codesign --force --deep --sign - \
              --entitlements "VDF.GUI/Assets/macOS/entitlements.plist" \
              outputCLI/vdf-cli
            codesign --force --deep --sign - \
              --entitlements "VDF.GUI/Assets/macOS/entitlements.plist" \
              outputWeb/VDF.Web
            tar czvf "CLI-${{ matrix.target }}.tar.gz" "outputCLI"
            tar czvf "Web-${{ matrix.target }}.tar.gz" "outputWeb"
          else
            # Bundle .desktop file and icon for Linux desktop integration
            cp "VDF.GUI/Assets/Linux/icon.png" "outputGUI/icon.png"
            cp "VDF.GUI/Assets/Linux/videoduplicatefinder.desktop" "outputGUI/videoduplicatefinder.desktop"
            tar czvf "GUI-${{ matrix.target }}.tar.gz" "outputGUI"
            tar czvf "CLI-${{ matrix.target }}.tar.gz" "outputCLI"
            tar czvf "Web-${{ matrix.target }}.tar.gz" "outputWeb"
          fi
          # Clean up
          rm -rf "outputGUI" "outputCLI" "outputWeb" "Video Duplicate Finder.app"
          
    - name: Publish
      if: github.ref_type == 'branch'
      uses: softprops/action-gh-release@v3
      with:
          tag_name: 4.1.x
          # "Latest" belongs to the newest versioned release; the API default (true)
          # would move it back here on every push.
          make_latest: false
          files: |
            GUI-*
            CLI-*
            Web-*
          body: |
            Note: These are daily builds. Attachments are automatically created and replaced on every new commit. Regardless of what the message above says. If you experience upgrade issues you may need to delete your 'ScannedFiles.db' file in VDF folder.
            4.1 highlights: redesigned interface (guided Set up / Scan / Review flow, scan profiles, reworked results list and settings) on top of all 4.0.x features. Databases and settings carry over. Prefer the old interface? The final classic build stays available in the 4.0.x release.
            Last build based on ${{ steps.vars.outputs.sha_short }}
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to the versioned release
      if: github.ref_type == 'tag'
      shell: bash
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # No --clobber: an asset of a versioned release is never replaced.
      run: gh release upload "$GITHUB_REF_NAME" GUI-* CLI-* Web-*

  publish-release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Only after every platform uploaded: a package manager never sees a partial release.
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest


