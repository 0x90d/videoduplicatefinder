name: Build & Release

# Unified workflow for both nightly and versioned releases, following the
# Neovim model: a single file with three trigger paths.
#
#   1. Push to master → nightly build (prerelease, overwrites previous nightly)
#   2. Push of v*.*.* tag → versioned release (immutable, not a prerelease)
#   3. Manual dispatch → can do either, depending on the tag_name input

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (use "nightly" for a nightly build, or e.g. "v4.1.1" for a release)'
        required: true
        default: nightly

permissions:
  contents: write

jobs:

  # ── Determine build type and parameters ────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      is_nightly: ${{ steps.vars.outputs.is_nightly }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
      release_name: ${{ steps.vars.outputs.release_name }}
      sha_short: ${{ steps.vars.outputs.sha_short }}
    steps:
      - name: Determine build parameters
        id: vars
        shell: bash
        run: |
          # Determine TAG_NAME based on trigger source
          if [[ -n "${{ github.event.inputs.tag_name }}" ]]; then
            # Manual dispatch
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Version tag push (e.g. v4.1.1)
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            # Push to master → nightly
            TAG_NAME="nightly"
          fi

          if [[ "$TAG_NAME" == "nightly" ]]; then
            echo "is_nightly=true" >> $GITHUB_OUTPUT
            echo "release_name=Nightly" >> $GITHUB_OUTPUT
          else
            echo "is_nightly=false" >> $GITHUB_OUTPUT
            # Strip 'v' prefix for release title (e.g. v4.1.1 → 4.1.1)
            echo "release_name=${TAG_NAME#v}" >> $GITHUB_OUTPUT
          fi

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "sha_short=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

  # ── Move nightly tag to current HEAD (only for nightly builds) ─────────────
  retag:
    needs: setup
    if: needs.setup.outputs.is_nightly == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Move nightly tag
        run: |
          git tag -f nightly HEAD
          git push origin refs/tags/nightly --force

  # ── Clean up old nightly assets (only for nightly builds) ──────────────────
  cleanup:
    needs: retag
    if: always() && needs.setup.outputs.is_nightly == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Delete old release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null \
            | while read -r asset; do
                gh release delete-asset nightly "$asset" --yes
              done || true

  # ── Build matrix (shared by both nightly and release) ──────────────────────
  build:
    needs: [setup, cleanup]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        kind: ['linux', 'windows', 'windowsarm64', 'macOS', 'macOSarm64', 'linuxarm64']
        include:
          - kind: linux
            os: ubuntu-latest
            target: linux-x64
            name: linux-x64
          - kind: windows
            os: windows-latest
            target: win-x64
            name: win-x64
          - kind: windowsarm64
            os: windows-11-arm
            target: win-arm64
            name: win-arm64
          - kind: macOS
            os: macos-latest
            target: osx-x64
            name: osx-x64
          - kind: macOSarm64
            os: macos-latest
            target: osx-arm64
            name: osx-arm64
          - kind: linuxarm64
            os: ubuntu-24.04-arm
            target: linux-arm64
            name: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Build
      shell: bash
      run: |
          # Build GUI (Native AOT)
          dotnet publish ./VDF.GUI/VDF.GUI.csproj -c Release -v q -p:PublishAot=true -r "${{ matrix.target }}" -o "outputGUI"
          # Build CLI (Native AOT)
          dotnet publish ./VDF.CLI/VDF.CLI.csproj -c Release -v q -p:PublishAot=true -r "${{ matrix.target }}" -o "outputCLI"
          # Build Web (JIT, self-contained — Blazor Server is not supported under Native AOT)
          dotnet publish ./VDF.Web/VDF.Web.csproj -c Release -v q --self-contained -r "${{ matrix.target }}" -o "outputWeb"
          # Pack files
          if [[ "${{ matrix.target }}" == win-* ]]; then
            7z a -tzip "GUI-${{ matrix.target }}.zip" "./outputGUI/*"
            7z a -tzip "CLI-${{ matrix.target }}.zip" "./outputCLI/*"
            7z a -tzip "Web-${{ matrix.target }}.zip" "./outputWeb/*"
          elif [[ "${{ matrix.target }}" == osx-* ]]; then
            # Wrap the GUI in a proper macOS .app bundle
            mkdir -p "Video Duplicate Finder.app/Contents/MacOS"
            mkdir -p "Video Duplicate Finder.app/Contents/Resources"
            cp -r outputGUI/. "Video Duplicate Finder.app/Contents/MacOS/"
            cp "VDF.GUI/Assets/macOS/icon.icns" "Video Duplicate Finder.app/Contents/Resources/icon.icns"
            cp "VDF.GUI/Assets/macOS/Info.plist" "Video Duplicate Finder.app/Contents/Info.plist"
            chmod +x "Video Duplicate Finder.app/Contents/MacOS/VDF.GUI"
            # Ad-hoc sign every binary in the bundle
            codesign --force --deep --sign - \
              --entitlements "VDF.GUI/Assets/macOS/entitlements.plist" \
              "Video Duplicate Finder.app"
            codesign --verify --deep --strict --verbose=2 "Video Duplicate Finder.app"
            tar czvf "GUI-${{ matrix.target }}.tar.gz" "Video Duplicate Finder.app"
            chmod +x outputCLI/vdf-cli
            chmod +x outputWeb/VDF.Web
            codesign --force --deep --sign - \
              --entitlements "VDF.GUI/Assets/macOS/entitlements.plist" \
              outputCLI/vdf-cli
            codesign --force --deep --sign - \
              --entitlements "VDF.GUI/Assets/macOS/entitlements.plist" \
              outputWeb/VDF.Web
            tar czvf "CLI-${{ matrix.target }}.tar.gz" "outputCLI"
            tar czvf "Web-${{ matrix.target }}.tar.gz" "outputWeb"
          else
            # Bundle .desktop file and icon for Linux desktop integration
            cp "VDF.GUI/Assets/Linux/icon.png" "outputGUI/icon.png"
            cp "VDF.GUI/Assets/Linux/videoduplicatefinder.desktop" "outputGUI/videoduplicatefinder.desktop"
            tar czvf "GUI-${{ matrix.target }}.tar.gz" "outputGUI"
            tar czvf "CLI-${{ matrix.target }}.tar.gz" "outputCLI"
            tar czvf "Web-${{ matrix.target }}.tar.gz" "outputWeb"
          fi
          # Clean up
          rm -rf "outputGUI" "outputCLI" "outputWeb" "Video Duplicate Finder.app"

    # ── Publish as nightly pre-release ───────────────────────────────────────
    - name: Publish nightly
      if: needs.setup.outputs.is_nightly == 'true'
      uses: softprops/action-gh-release@v3
      with:
          tag_name: nightly
          prerelease: true
          name: Nightly
          files: |
            GUI-*
            CLI-*
            Web-*
          body: |
            ⚠️ **Nightly build — artifacts are replaced on every push to master.**

            These are automatically generated development builds. They may contain bugs or unfinished features. Use at your own risk.

            **Last build based on commit `${{ needs.setup.outputs.sha_short }}`**

            ---

            4.1 highlights: redesigned interface (guided Set up / Scan / Review flow, scan profiles, reworked results list and settings) on top of all 4.0.x features. Databases and settings carry over. Prefer the old interface? The final classic build stays available in the 4.0.x release.

            If you experience upgrade issues you may need to delete your 'ScannedFiles.db' file in the VDF folder.
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ── Publish as versioned release ─────────────────────────────────────────
    - name: Generate release notes
      if: needs.setup.outputs.is_nightly == 'false'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes \
          -f tag_name="${{ needs.setup.outputs.tag_name }}" 2>/dev/null | jq -r '.body' 2>/dev/null || echo "")
        if [[ -z "$NOTES" ]]; then
          NOTES="Release ${{ needs.setup.outputs.release_name }} based on commit ${{ needs.setup.outputs.sha_short }}"
        fi
        echo "$NOTES" > release_notes.md

    - name: Publish release
      if: needs.setup.outputs.is_nightly == 'false'
      uses: softprops/action-gh-release@v3
      with:
          tag_name: ${{ needs.setup.outputs.tag_name }}
          prerelease: false
          name: ${{ needs.setup.outputs.release_name }}
          body_path: release_notes.md
          files: |
            GUI-*
            CLI-*
            Web-*
      env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
